<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Event Calendar v9.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2 family=Quicksand:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f8fafc; /* เปลี่ยนเป็นสีสว่างนุ่มนวลแบบ Cozy */
            color: #1e293b;
            margin: 0;
            padding: 15px;
        }
        .calendar-container {
            max-width: 1250px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(148, 163, 184, 0.12);
            border: 1px solid #e2e8f0;
        }
        
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h2 {
            color: #334155;
            font-size: 40px;
            margin: 0;
            font-weight: 800;
            letter-spacing: -1px;
        }
        
        .home-btn {
            background-color: #f1f5f9;
            color: #64748b;
            text-decoration: none;
            padding: 12px 26px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 18px;
            border: 2px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        .home-btn:hover {
            background-color: #cbd5e1;
            color: #334155;
        }

        /* โครงสร้างตารางปฏิทิน */
        .fc {
            --fc-border-color: #f1f5f9; /* เส้นตารางจางลงเพื่อความคลีน มินิมอล */
            --fc-today-bg-color: #f0f9ff;
        }
        .fc-theme-standard td, .fc-theme-standard th {
            border: 2px solid #f1f5f9 !important;
        }
        
        /* [v9.0] เพิ่มพื้นที่แนวตั้งให้ช่องแต่ละวันหลวมขึ้น ดูไม่แออัด */
        .fc-daygrid-day-frame {
            min-height: 200px !important; 
            padding: 6px !important;
        }
        
        /* วัน Sun - Sat ด้านบน หัวข้อใหญ่ชัดเจน */
        .fc-col-header-cell {
            background-color: #f8fafc !important;
            padding: 20px 0 !important;
        }
        .fc-col-header-cell-cushion {
            color: #475569 !important;
            font-weight: 800;
            font-size: 24px;
            text-decoration: none !important;
        }
        
        /* [v9.0] จัดการช่องไฟ (Gap) ระหว่างแท่งอีเวนต์ ให้ห่างกันแบบพอดีๆ */
        .fc-daygrid-event-harness {
            margin: 6px 4px !important; /* ดันช่องไฟแนวตั้ง (6px) และแนวนอน (4px) ให้แยกชั้นกันชัดเจน */
        }

        /* [v9.0] แท่งกิจกรรมดีไซน์ Cozy & Bold */
        .fc-v-event, .fc-h-event {
            border: none !important;
            border-radius: 12px !important; /* กล่องมนขึ้นสไตล์ UI เกมโมเดิร์น */
            padding: 8px 14px !important; /* เพิ่มพื้นที่ด้านในกล่องให้ตัวหนังสือไม่เบียดขอบ */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important;
        }
        
        /* [v9.0] ตัวหนังสือแบบตะโกนขยายใหญ่ขึ้นมากเพื่อบอทแคปลง Discord */
        .fc-event-title {
            font-weight: 800 !important;
            font-size: 20px !important; /* ขยายใหญ่สะใจ (จากเดิม 16px) */
            line-height: 1.3 !important;
            white-space: nowrap !important; 
            overflow: hidden !important;
            text-overflow: ellipsis !important; 
            display: block !important;
            letter-spacing: -0.3px;
        }
        
        /* เลขวันที่ขนาดใหญ่ */
        .fc-daygrid-day-number {
            color: #94a3b8 !important;
            padding: 8px 12px !important;
            font-weight: 800;
            font-size: 22px; 
            text-decoration: none !important;
        }

        .footer-credit {
            text-align: center;
            margin-top: 40px;
            font-size: 18px;
            color: #94a3b8;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="header-area">
        <h2>> Isekai Event Calendar</h2>
        <a href="https://sirslackerking.github.io/isekai-adventure-life-tools/" class="home-btn">🏠 Home</a>
    </div>
    
    <div id="calendar"></div>
    
    <div class="footer-credit">v9.0 • Dev by Thinking.j17 • CozyNeko Guild S12</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const CALENDAR_ID = '90139e27a31a630fd671e92c693bea33fea7d8e23950687a3f8f7105328ae5a5@group.calendar.google.com';
        const API_KEY = 'AIzaSyCWQS8RCOqWtRL6qL4nyxRmOu6YvrxK00Q'; 

        // 🌟 แก้ไขจุดที่ 1: ตั้งค่าให้ดึงวันที่ปัจจุบันใหม่สดๆ และรีเซ็ตเวลาเป็น 00:00:00 น. เพื่อตัดปัญหาวันที่ค้างข้ามคืน
        const now = new Date();
        now.setHours(0, 0, 0, 0); // บังคับเริ่มที่เที่ยงคืนของวันปัจจุบัน

        const future = new Date(now);
        future.setDate(now.getDate() + 35); // นับต่อไปอีก 35 วัน (5 สัปดาห์)

        const timeMin = now.toISOString();
        const timeMax = future.toISOString();

        // เพิ่มพารามิเตอร์ต้าน Cache ไปใน URL ของ Google Calendar API (ใส่สุ่มตัวเลขเวลาปัจจุบันเข้าไปท้าย URL)
        const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime&_nocache=${new Date().getTime()}`;

        // สเกลคู่สีให้อ่านง่าย สบายตาขึ้นเมื่อฟอนต์ขยายใหญ่
        const customColorLogic = (title) => {
            if (title.includes('[Ranking]')) return { bg: '#e6fbf1', text: '#047857' };      // เขียวพาสเทลคลีนๆ
            if (title.includes('[Special Event]')) return { bg: '#f3e8ff', text: '#7e22ce' }; // ม่วงลาเวนเดอร์นุ่มๆ
            if (title.includes('[Regular]')) return { bg: '#fef9c3', text: '#a16207' };      // เหลืองครีมละมุน
            if (title.includes('[Mega]')) return { bg: '#ff9233', text: '#ffffff' };         // ส้มสด (เด่นชัด)
            if (title.includes('[Guild War]')) return { bg: '#ff5555', text: '#ffffff' };    // แดงสด (เด่นชัด)
            return { bg: '#f1f5f9', text: '#475569' }; 
        };

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const events = (data.items || []).map(event => {
                    const isAllDay = event.start.date ? true : false;
                    const colorStyle = customColorLogic(event.summary);
                    
                    return {
                        title: event.summary,
                        start: isAllDay ? event.start.date : event.start.dateTime,
                        end: isAllDay ? event.end.date : event.end.dateTime,
                        allDay: isAllDay,
                        backgroundColor: colorStyle.bg,
                        textColor: colorStyle.text
                    };
                });

                const calendarEl = document.getElementById('calendar');
                const calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGrid',
                    initialDate: now, // 🌟 แก้ไขจุดที่ 2: บังคับให้ FullCalendar เปิดมาที่วันปัจจุบัน (เที่ยงคืนวันนี้) เสมอ ไม่ใช้ค่าดีฟอลต์ค้างเว็บ
                    duration: { weeks: 5 }, 
                    headerToolbar: false, 
                    events: events,
                    locale: 'en',
                    height: 'auto',
                    eventDisplay: 'block',
                    dayMaxEventRows: false 
                });
                
                calendar.render();
            })
            .catch(err => console.error(err));
    });
</script>


</body>
</html>
