<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Event Calendar v10.5</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        /* --- 🎨 ธีมสีสว่างละมุนตา Contrast สูง อ่านง่ายสุดๆ สำหรับ Discord --- */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9; 
            margin: 0;
            padding: 10px;
        }

        .calendar-container {
            max-width: 1650px; 
            margin: 0 auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            border: 2px solid #cbd5e1;
        }

        .calendar-header h1 {
            font-size: 46px; 
            font-weight: 900;
            color: #1e293b;
            margin: 0 0 5px 0;
            letter-spacing: -0.5px;
        }

        /* 👑 ข้อความเครดิตกิลด์ตามบรีฟ (CozyNeko Guild) */
        .calendar-credit {
            font-size: 18px;
            font-weight: 700;
            color: #64748b; 
            margin: 0 0 30px 5px;
            letter-spacing: 0.5px;
        }

        /* --- FullCalendar Layout & Hyper Visibility --- */
        .fc {
            --fc-border-color: #94a3b8; 
            --fc-page-bg-color: #ffffff;
        }

        .fc-daygrid-day-frame {
            min-height: 220px !important; 
        }

        /* แถบหัววัน Sun - Sat ด้านบน */
        .fc-col-header-cell {
            background-color: #f8fafc !important;
            padding: 22px 0 !important; 
        }
        .fc-col-header-cell-cushion {
            font-weight: 900 !important;
            color: #0f172a !important;
            font-size: 28px !important; 
            text-decoration: none !important;
        }

        /* ตัวเลขวันที่ภายในช่องตาราง */
        .fc-daygrid-day-number {
            font-weight: 900 !important;
            color: #1e293b;
            padding: 16px !important;
            font-size: 28px !important; 
        }

        /* 🌟 กรอบและสีช่อง "วันนี้" ล็อกให้หนาชัดเจนสู้บอทแคปรูป */
        .fc-day-today {
            background-color: #e0f2fe !important; 
            border: 5px solid #0284c7 !important; 
            z-index: 4;
        }

        .fc-day-today .fc-daygrid-day-number {
            color: #0369a1 !important; 
            font-size: 30px !important; 
        }

        /* ดีไซน์แท่งกิจกรรมแบบหนาพิเศษ */
        .fc-daygrid-event-harness {
            margin: 10px 12px !important; 
        }

        .fc-v-event, .fc-h-event {
            border: none !important;
            border-radius: 14px !important; 
            padding: 14px 18px !important; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        /* ฟอนต์กิจกรรมระดับ XXL อ่านง่ายแม้ดูจากมือถือ */
        .fc-event-title {
            font-weight: 900 !important;
            font-size: 26px !important; 
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <h1>📅 Isekai Event Calendar v10.5</h1>
            <div class="calendar-credit">Dev by URBROBERM | CozyNeko Guild</div>
        </div>
        <div id="calendar"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const CALENDAR_ID = '90139e27a31a630fd671e92c693bea33fea7d8e23950687a3f8f7105328ae5a5@group.calendar.google.com';
            const API_KEY = 'AIzaSyCWQS8RCOqWtRL6qL4nyxRmOu6YvrxK00Q'; 

            // 🌟 คำนวณวันปัจจุบันและบวก Offset สำหรับตั้งค่าให้เป็นเวลาไทย (GMT+7) อย่างแน่นอน
            const tzOffset = 7 * 60 * 60 * 1000; 
            const d = new Date();
            const localTime = d.getTime();
            const localOffset = d.getTimezoneOffset() * 60000;
            const utc = localTime + localOffset;
            const bangkokTime = new Date(utc + tzOffset);

            // ตั้งค่าเวลาเป็น 00:00:00 ของเวลาไทยเด็ดขาด
            const now = new Date(bangkokTime.getFullYear(), bangkokTime.getMonth(), bangkokTime.getDate(), 0, 0, 0, 0);

            // 🌟 [เพิ่มตรงนี้] สร้างข้อความวันที่ "YYYY-MM-DD" ของฝั่งไทย เพื่อเอาไปตบหน้าตาราง FullCalendar
            const pad = (num) => String(num).padStart(2, '0');
            const localTodayStr = `${bangkokTime.getFullYear()}-${pad(bangkokTime.getMonth()+1)}-${pad(bangkokTime.getDate())}`;

            const future = new Date(now);
            future.setDate(now.getDate() + 35); 

            // แปลงให้อยู่ในรูปแบบ ISO String พร้อมแนบ Offset +07:00 ส่งไปให้กูเกิล API ล็อกหน้าผลลัพธ์
            const formatISOWithTZ = (date) => {
                return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T00:00:00+07:00`;
            };

            const timeMinISO = formatISOWithTZ(now);
            const timeMaxISO = formatISOWithTZ(future);

            // ยิงไปที่ Google Calendar API โดยระบุช่วงเวลาแบบ Hardcoded โซนไทยเพื่อขจัดปัญหาเบราว์เซอร์แคปรูปเอ๋อ
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${encodeURIComponent(timeMinISO)}&timeMax=${encodeURIComponent(timeMaxISO)}&singleEvents=true&orderBy=startTime&_nocache=${new Date().getTime()}`;

            // โลจิกคู่สีพาสเทล Contrast สูงสุดตามภาพจริง
            const customColorLogic = (title) => {
                if (title.includes('[Ranking]')) return { bg: '#a5d6a7', text: '#003300' };      
                if (title.includes('[Special Event]')) return { bg: '#ab47bc', text: '#ffffff' }; 
                if (title.includes('[Regular]')) return { bg: '#cfd8dc', text: '#263238' };       
                if (title.includes('[Mega]')) return { bg: '#fdd835', text: '#4e342e' };          
                if (title.includes('[Guild War]')) return { bg: '#e53935', text: '#ffffff' };     
                return { bg: '#e2e8f0', text: '#334155' }; 
            };

            function extractAllSuffixEmojis(text) {
                const emojiRegex = /([\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{24C2}-\u{1F251}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]+)/gu;
                const matches = text.match(emojiRegex);
                return matches ? matches.join('') : '';
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const events = (data.items || []).map(event => {
                        const isAllDay = event.start.date ? true : false;
                        const colorStyle = customColorLogic(event.summary);
                        
                        let cleanTitle = event.summary
                            .replace(/\[Mega\]|\[Regular\]|\[Guild War\]|\[Special Event\]|\[Ranking\]/g, '')
                            .replace(/:\s*/g, '') 
                            .trim();

                        const allEmojis = extractAllSuffixEmojis(cleanTitle);

                        if (allEmojis) {
                            cleanTitle = cleanTitle.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{24C2}-\u{1F251}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]/gu, '').trim();
                            cleanTitle = `${allEmojis} ${cleanTitle}`;
                        } else {
                            if (event.summary.includes('[Mega]')) cleanTitle = `🔸 ${cleanTitle}`;
                            else if (event.summary.includes('[Guild War]')) cleanTitle = `⚔️ ${cleanTitle}`;
                        }

                        return {
                            title: cleanTitle,
                            start: isAllDay ? event.start.date : event.start.dateTime,
                            end: isAllDay ? event.end.date : event.end.dateTime,
                            allDay: isAllDay,
                            backgroundColor: colorStyle.bg,
                            textColor: colorStyle.text
                        };
                    });

                    const calendarEl = document.getElementById('calendar');
                    const calendar = new FullCalendar.Calendar(calendarEl, {
                        initialView: 'dayGrid',
                        // 🌟 [เพิ่มตรงนี้] บังคับแกนโลกปฏิทินให้ล็อกตามตัวแปรวันที่ไทย หักดิบเวลาเซิร์ฟเวอร์บอท
                        initialDate: localTodayStr,
                        now: localTodayStr,
                        duration: { weeks: 5 }, 
                        headerToolbar: false, 
                        events: events,
                        locale: 'en',
                        height: 'auto',
                        eventDisplay: 'block',
                        dayMaxEventRows: false 
                    });
                    
                    calendar.render();
                })
                .catch(err => console.error(err));
        });
    </script>
</body>
</html>
