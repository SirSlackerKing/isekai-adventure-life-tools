<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Event Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f8fafc; /* พื้นหลังสีสว่าง คลีน มินิมอล */
            color: #334155;
            margin: 0;
            padding: 16px;
        }
        .calendar-container {
            max-width: 1300px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 24px; /* โค้งมนนุ่มนวลแบบอินเตอร์เฟสเกม */
            box-shadow: 0 10px 30px rgba(148, 163, 184, 0.15);
            border: 2px solid #f1f5f9;
            position: relative;
        }
        
        /* ส่วนหัวแถบบนสุด */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        h2 {
            color: #475569;
            font-size: 28px;
            margin: 0;
            font-weight: 800;
        }
        
        /* ปุ่ม Home สไตล์มินิมอลน่ารัก */
        .home-btn {
            background-color: #e2e8f0;
            color: #475569;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .home-btn:hover {
            background-color: #cbd5e1;
            transform: translateY(-1px);
        }

        /* ตารางปฏิทินสไตล์พาสเทล */
        .fc {
            --fc-border-color: #e2e8f0;
            --fc-page-bg-color: #ffffff;
            --fc-neutral-bg-color: #f8fafc;
            --fc-today-bg-color: #eff6ff;
        }
        .fc-theme-standard td, .fc-theme-standard th {
            border: 1px solid #e2e8f0 !important;
        }
        
        /* หัวข้อวัน (Sun - Sat) */
        .fc-col-header-cell {
            background-color: #f8fafc !important;
            padding: 14px 0 !important;
            border: none !important;
        }
        .fc-col-header-cell-cushion {
            color: #64748b !important;
            font-weight: 800;
            font-size: 16px;
            text-decoration: none !important;
        }
        
        /* แท่งกิจกรรมแบบหนาเต็มจอโชว์ในมือถือชัดเจน */
        .fc-v-event, .fc-h-event {
            border: none !important;
            border-radius: 10px !important;
            padding: 8px 12px !important;
            margin-bottom: 5px !important;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05) !important;
        }
        .fc-event-title {
            font-weight: 800 !important;
            font-size: 15px !important;
            line-height: 1.3 !important;
        }
        
        /* ตัวเลขวันที่ */
        .fc-daygrid-day-number {
            color: #94a3b8 !important;
            padding: 12px !important;
            font-weight: 800;
            font-size: 15px;
            text-decoration: none !important;
        }
        
        /* แถบหัวข้อชื่อช่วงสัปดาห์ปัจจุบัน */
        .fc-header-toolbar {
            justify-content: center !important;
            margin-bottom: 15px !important;
        }
        .fc-toolbar-title {
            font-size: 18px !important;
            color: #94a3b8 !important;
            font-weight: 700;
        }

        /* เครดิตผู้พัฒนาด้านล่างสุด */
        .footer-credit {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="header-area">
        <h2>> Isekai Event Calendar</h2>
        <a href="https://sirslackerking.github.io/isekai-adventure-life-tools/" class="home-btn">🏠 Home</a>
    </div>
    
    <div id="calendar"></div>
    
    <div class="footer-credit">Dev by Thinking.j17 • CozyNeko Guild S12</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const CALENDAR_ID = '90139e27a31a630fd671e92c693bea33fea7d8e23950687a3f8f7105328ae5a5@group.calendar.google.com';
        const API_KEY = 'AIzaSyCWQS8RCOqWtRL6qL4nyxRmOu6YvrxK00Q'; 

        const now = new Date();
        const future = new Date();
        future.setDate(now.getDate() + 25); 

        const timeMin = now.toISOString();
        const timeMax = future.toISOString();

        const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`;

        const customColorLogic = (title) => {
            if (title.includes('[Ranking]')) return { bg: '#a7f3d0', text: '#065f46' };      // เขียวมิ้นท์
            if (title.includes('[Special Event]')) return { bg: '#e9d5ff', text: '#6b21a8' }; // ม่วงลาเวนเดอร์
            if (title.includes('[Regular]')) return { bg: '#fef08a', text: '#854d0e' };      // เหลืองครีม
            if (title.includes('[Mega]')) return { bg: '#ff9233', text: '#ffffff' };         // ส้มสด เด่นชัด
            if (title.includes('[Guild War]')) return { bg: '#ff5555', text: '#ffffff' };    // แดงสด เด่นชัด
            return { bg: '#f5e6d3', text: '#78350f' }; // น้ำตาลเบจทั่วไป
        };

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const events = (data.items || []).map(event => {
                    const isAllDay = event.start.date ? true : false;
                    const colorStyle = customColorLogic(event.summary);
                    
                    return {
                        title: `🔹 ${event.summary}`,
                        start: isAllDay ? event.start.date : event.start.dateTime,
                        end: isAllDay ? event.end.date : event.end.dateTime,
                        allDay: isAllDay,
                        backgroundColor: colorStyle.bg,
                        textColor: colorStyle.text
                    };
                });

                const calendarEl = document.getElementById('calendar');
                const calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGrid',
                    duration: { weeks: 3 }, // ล็อกให้แสดงผล 3 สัปดาห์ต่อเนื่องข้ามเดือน เริ่มต้นที่ปัจจุบันเสมอ
                    headerToolbar: { left: '', center: 'title', right: '' },
                    events: events,
                    locale: 'en',
                    height: 'auto',
                    eventDisplay: 'block',
                    dayMaxEventRows: false 
                });
                
                calendar.render();
            })
            .catch(err => {
                console.error(err);
            });
    });
</script>

</body>
</html>
