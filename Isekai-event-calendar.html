<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Timeline - Isekai Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .calendar-container {
            max-width: 1400px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        h2 {
            text-align: center;
            color: #fbbf24;
            font-size: 28px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }
        /* FullCalendar Custom Theme */
        .fc {
            --fc-border-color: #334155;
            --fc-page-bg-color: #1e293b;
            --fc-neutral-bg-color: #0f172a;
            --fc-list-event-hover-bg-color: #334155;
            --fc-today-bg-color: rgba(56, 189, 248, 0.1);
        }
        /* Header Date Styling */
        .fc-col-header-cell {
            background-color: #1e293b !important;
            padding: 12px 0 !important;
        }
        .fc-col-header-cell-cushion {
            color: #94a3b8 !important;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
        }
        /* Event Bar Styling */
        .fc-v-event, .fc-h-event {
            border: none !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border-radius: 6px !important;
            padding: 4px 8px;
            margin-bottom: 2px;
        }
        .fc-event-title {
            font-weight: 700 !important;
            font-size: 13px !important;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
            color: #ffffff !important;
        }
        /* Day Numbers */
        .fc-daygrid-day-number {
            color: #cbd5e1 !important;
            padding: 8px !important;
            font-weight: 600;
        }
        #loading {
            text-align: center;
            color: #fbbf24;
            padding: 30px;
            font-size: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <h2>🏆 Guild Activity Timeline</h2>
    <div id="loading">Synchronizing Calendar Data...</div>
    <div id="calendar"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const CALENDAR_ID = '90139e27a31a630fd671e92c693bea33fea7d8e23950687a3f8f7105328ae5a5@group.calendar.google.com';
        const API_KEY = 'AIzaSyCWQS8RCOqWtRL6qL4nyxRmOu6YvrxK00Q'; 

        const now = new Date();
        const future = new Date();
        future.setDate(now.getDate() + 20); 

        const timeMin = now.toISOString();
        const timeMax = future.toISOString();

        const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`;

        // Color Mapping based on your request
        const customColorLogic = (title) => {
            if (title.includes('[Ranking]')) return '#22c55e';      // Green
            if (title.includes('[Special Event]')) return '#a855f7'; // Purple
            if (title.includes('[Regular]')) return '#eab308';      // Yellow
            if (title.includes('[Mega]')) return '#f97316';         // Orange
            if (title.includes('[Guild War]')) return '#ef4444';    // Red
            return '#711616'; // Default Guild Red
        };

        fetch(url)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                const events = (data.items || []).map(event => {
                    const isAllDay = event.start.date ? true : false;
                    return {
                        title: event.summary,
                        start: isAllDay ? event.start.date : event.start.dateTime,
                        end: isAllDay ? event.end.date : event.end.dateTime,
                        allDay: isAllDay,
                        backgroundColor: customColorLogic(event.summary)
                    };
                });

                const calendarEl = document.getElementById('calendar');
                const calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth', // This creates the top-date grid view
                    headerToolbar: { left: 'title', center: '', right: '' },
                    events: events,
                    locale: 'en',
                    height: 'auto',
                    eventDisplay: 'block', // Forces the horizontal bar style
                    dayMaxEventRows: false // Ensures all bars show without "more" link
                });
                
                calendar.render();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading').innerText = 'System Connection Error.';
            });
    });
</script>

</body>
</html>
