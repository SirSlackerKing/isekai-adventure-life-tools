<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Event Calendar v5.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f1f5f9; 
            color: #1e293b;
            margin: 0;
            padding: 10px;
        }
        .calendar-container {
            max-width: 1200px; /* บีบความกว้างเล็กน้อยเพื่อให้ตอนแคปรูป ตัวหนังสือจะดูใหญ่ขึ้นเมื่อเทียบกับพื้นที่ */
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            border: 3px solid #e2e8f0;
        }
        
        /* หัวข้อ v5.0 ขยายใหญ่พิเศษ */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h2 {
            color: #334155;
            font-size: 42px; /* ขยายใหญ่มาก */
            margin: 0;
            font-weight: 800;
            letter-spacing: -1px;
        }
        
        .home-btn {
            background-color: #f1f5f9;
            color: #64748b;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 18px;
            border: 2px solid #e2e8f0;
        }

        /* ตารางปฏิทิน v5.0 */
        .fc {
            --fc-border-color: #cbd5e1;
            --fc-today-bg-color: #f0f9ff;
        }
        .fc-theme-standard td, .fc-theme-standard th {
            border: 2px solid #e2e8f0 !important;
        }
        
        /* วัน Sun - Sat ขยายใหญ่ */
        .fc-col-header-cell {
            background-color: #f8fafc !important;
            padding: 18px 0 !important;
        }
        .fc-col-header-cell-cushion {
            color: #475569 !important;
            font-weight: 800;
            font-size: 24px; /* ใหญ่มาก */
            text-decoration: none !important;
        }
        
        /* แท่งกิจกรรม v5.0 อัดฉีดขนาดตัวอักษร */
        .fc-v-event, .fc-h-event {
            border: none !important;
            border-radius: 12px !important;
            padding: 10px 15px !important; /* หนาขึ้น */
            margin-bottom: 6px !important;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1) !important;
        }
        .fc-event-title {
            font-weight: 800 !important;
            font-size: 20px !important; /* ขนาดนี้เห็นชัดแน่นอนใน Discord Preview */
            line-height: 1.2 !important;
            white-space: normal !important; /* ให้ขึ้นบรรทัดใหม่ได้ถ้าชื่อยาว */
        }
        
        /* เลขวันที่ขยายใหญ่ */
        .fc-daygrid-day-number {
            color: #64748b !important;
            padding: 15px !important;
            font-weight: 800;
            font-size: 22px; 
            text-decoration: none !important;
        }

        .fc-daygrid-event-harness {
            margin: 2px 4px !important;
        }

        /* เครดิต */
        .footer-credit {
            text-align: center;
            margin-top: 30px;
            font-size: 18px;
            color: #94a3b8;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="header-area">
        <h2>> Isekai Event Calendar</h2>
        <a href="https://sirslackerking.github.io/isekai-adventure-life-tools/" class="home-btn">🏠 Home</a>
    </div>
    
    <div id="calendar"></div>
    
    <div class="footer-credit">v5.0 • Dev by Thinking.j17 • CozyNeko Guild S12</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const CALENDAR_ID = '90139e27a31a630fd671e92c693bea33fea7d8e23950687a3f8f7105328ae5a5@group.calendar.google.com';
        const API_KEY = 'AIzaSyCWQS8RCOqWtRL6qL4nyxRmOu6YvrxK00Q'; 

        const now = new Date();
        const future = new Date();
        future.setDate(now.getDate() + 35); // ดึงข้อมูลล่วงหน้า 35 วัน (เพื่อให้ครอบคลุม 30 วันใน Grid)

        const timeMin = now.toISOString();
        const timeMax = future.toISOString();

        const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`;

        const customColorLogic = (title) => {
            if (title.includes('[Ranking]')) return { bg: '#a7f3d0', text: '#064e3b' };      
            if (title.includes('[Special Event]')) return { bg: '#e9d5ff', text: '#581c87' }; 
            if (title.includes('[Regular]')) return { bg: '#fef08a', text: '#713f12' };      
            if (title.includes('[Mega]')) return { bg: '#ff9233', text: '#ffffff' };         
            if (title.includes('[Guild War]')) return { bg: '#ff5555', text: '#ffffff' };    
            return { bg: '#f1f5f9', text: '#475569' }; 
        };

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const events = (data.items || []).map(event => {
                    const isAllDay = event.start.date ? true : false;
                    const colorStyle = customColorLogic(event.summary);
                    
                    return {
                        title: event.summary,
                        start: isAllDay ? event.start.date : event.start.dateTime,
                        end: isAllDay ? event.end.date : event.end.dateTime,
                        allDay: isAllDay,
                        backgroundColor: colorStyle.bg,
                        textColor: colorStyle.text
                    };
                });

                const calendarEl = document.getElementById('calendar');
                const calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGrid',
                    duration: { weeks: 5 }, // [v5.0] โชว์ 5 สัปดาห์ (ประมาณ 35 วัน) เริ่มจากปัจจุบัน
                    headerToolbar: false, // ปิด Header ระบบเพื่อความมินิมอล
                    events: events,
                    locale: 'en',
                    height: 'auto',
                    eventDisplay: 'block',
                    dayMaxEventRows: false 
                });
                
                calendar.render();
            })
            .catch(err => console.error(err));
    });
</script>

</body>
</html>
