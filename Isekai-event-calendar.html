<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Event Calendar v9.5</title>
    
    <!-- FullCalendar 6.1.11 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        /* --- 🎨 ธีมโทนเข้มอุ่นระดับพรีเมียม (Deep & Warm RPG Theme) --- */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a1f2c; /* สีพื้นหลังสว่างกว่าเดิมเล็กน้อย ไม่มืดสนิทจนจม */
            margin: 0;
            padding: 10px;
        }

        .calendar-container {
            max-width: 1350px; /* ขยายความกว้างเต็มตา */
            margin: 0 auto;
            background: #232a3b; /* พื้นหลังกล่องปฏิทินโทน Slate อุ่นเข้ม */
            padding: 25px;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            border: 2px solid #2d3748;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 3px solid #2d3748;
            padding-bottom: 15px;
        }

        .calendar-header h1 {
            font-size: 34px;
            font-weight: 900;
            color: #f7fafc;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* --- FullCalendar Layout & Typography Upgrades --- */
        .fc {
            --fc-border-color: #2d3748; /* สีเส้นตารางคมชัด */
            --fc-page-bg-color: #232a3b;
        }

        /* เพิ่มความสูงของช่องตารางให้ใหญ่สะใจ มีพื้นที่หายใจกว้างขวาง */
        .fc-daygrid-day-frame {
            min-height: 200px !important; 
        }

        /* แถบหัววัน Sun - Sat ด้านบน */
        .fc-col-header-cell {
            background-color: #1a1f2c !important;
            padding: 16px 0 !important;
            border-bottom: 3px solid #2d3748 !important;
        }
        .fc-col-header-cell-cushion {
            font-weight: 900 !important;
            color: #cbd5e1 !important; 
            font-size: 22px !important; /* ขนาดหัววันใหญ่ขึ้นเด่นชัด */
            text-decoration: none !important;
        }

        /* ตัวเลขวันที่สากล */
        .fc-daygrid-day-number {
            font-weight: 900 !important;
            color: #94a3b8;
            padding: 12px !important;
            font-size: 20px !important; /* ขยายเลขที่ให้เห็นชัดๆ */
        }

        /* 🌟 ปรับปรุงจุดใหญ่: ถมสีช่อง "วันนี้" (Today Solid Highlight) ให้ดูดีมีมิติ */
        .fc-day-today {
            background-color: #3b2e2a !important; /* ถมสีส้มอิฐโทนอุ่นเข้มเต็มช่อง สบายตาแต่เด่นมาก */
            border: 4px solid #f97316 !important; /* ล้อมกรอบทองส้มเรืองแสง */
            box-shadow: inset 0 0 30px rgba(249, 115, 22, 0.25) !important;
            z-index: 5;
        }

        /* แท็กคำว่า TODAY แปะหัวมุม */
        .fc-day-today .fc-daygrid-day-top::before {
            content: "TODAY";
            font-size: 13px;
            font-weight: 900;
            color: #ffffff;
            background: #f97316;
            padding: 4px 12px;
            border-radius: 8px;
            margin-left: 12px;
            margin-top: 10px;
            display: inline-block;
            float: left;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }

        .fc-day-today .fc-daygrid-day-number {
            color: #ffedd5 !important; /* เลขวันของวันนี้เป็นสีส้มครีมสว่าง */
            font-size: 22px !important;
            text-shadow: 0 0 8px rgba(249, 115, 22, 0.5);
        }

        /* 🌟 ปรับแต่งกล่องกิจกรรมใหม่ ใหญ่ หนา ชัดเจน (Big Bold Event Elements) */
        .fc-daygrid-event-harness {
            margin: 8px 8px !important; /* เพิ่มช่องไฟห่างกันชัดเจน ไม่ติดเป็นพืด */
        }

        .fc-v-event, .fc-h-event {
            border-left: 8px solid rgba(0, 0, 0, 0.4) !important; /* ขอบซ้ายทึบเพิ่มมิติ */
            border-top: none !important;
            border-right: none !important;
            border-bottom: none !important;
            border-radius: 12px !important; /* ขอบมนสวยงามสไตล์ Modern UI */
            padding: 12px 16px !important; /* เพิ่มความหนาของแท่งกิจกรรมให้อวบอิ่ม อ่านง่าย */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
        }

        /* ฟอนต์ชื่ออีเวนต์แบบตัวหนาพิเศษ คมชัดสะใจ */
        .fc-event-title {
            font-weight: 900 !important;
            font-size: 19px !important; /* ขยายขนาดตัวหนังสือให้อ่านง่ายไม่ต้องเพ่ง */
            letter-spacing: -0.3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4); /* เพิ่มเงาให้ตัวหนังสือลอยเด่นออกมา */
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <h1>📅 Isekai Event Calendar v9.5</h1>
        </div>
        <div id="calendar"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const CALENDAR_ID = '90139e27a31a630fd671e92c693bea33fea7d8e23950687a3f8f7105328ae5a5@group.calendar.google.com';
            const API_KEY = 'AIzaSyCWQS8RCOqWtRL6qL4nyxRmOu6YvrxK00Q'; 

            const now = new Date();
            now.setHours(0, 0, 0, 0);

            const future = new Date(now);
            future.setDate(now.getDate() + 35); 

            const timeMin = now.toISOString();
            const timeMax = future.toISOString();

            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime&_nocache=${new Date().getTime()}`;

            // 🌟 ปรับปรุงโทนสีแท่งกิจกรรมให้สว่าง คมชัด และ Contrast สูงขึ้นมากในตารางเข้ม
            const customColorLogic = (title) => {
                if (title.includes('[Ranking]')) return { bg: '#10b981', text: '#ffffff' };      // เขียวนีออนสว่างสดใส ตัวหนังสือขาว
                if (title.includes('[Special Event]')) return { bg: '#a855f7', text: '#ffffff' }; // ม่วงสว่าง ตัวหนังสือขาว
                if (title.includes('[Regular]')) return { bg: '#4b5563', text: '#f3f4f6' };       // เทา Slate สว่าง ตัวหนังสือขาวเทา
                if (title.includes('[Mega]')) return { bg: '#f97316', text: '#ffffff' };          // ส้มแสดสะดุดตา ตัวหนังสือขาว (เด่นสุดๆ)
                if (title.includes('[Guild War]')) return { bg: '#ef4444', text: '#ffffff' };     // แดงสดตื่นตัว ตัวหนังสือขาว
                return { bg: '#64748b', text: '#ffffff' }; 
            };

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const events = (data.items || []).map(event => {
                        const isAllDay = event.start.date ? true : false;
                        const colorStyle = customColorLogic(event.summary);
                        
                        let cleanTitle = event.summary
                            .replace(/\[Mega\]|\[Regular\]|\[Guild War\]|\[Special Event\]|\[Ranking\]/g, '')
                            .trim();

                        const emojiMatch = cleanTitle.match(/([\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]+)\s*$/u);

                        if (emojiMatch) {
                            const emoji = emojiMatch[1]; 
                            cleanTitle = cleanTitle.substring(0, cleanTitle.lastIndexOf(emoji)).trim();
                            cleanTitle = `${emoji} ${cleanTitle}`; 
                        } else {
                            if (event.summary.includes('[Mega]')) cleanTitle = `🔸 ${cleanTitle}`;
                            else if (event.summary.includes('[Guild War]')) cleanTitle = `⚔️ ${cleanTitle}`;
                            else if (event.summary.includes('[Ranking]')) cleanTitle = `🏆 ${cleanTitle}`;
                        }

                        return {
                            title: cleanTitle,
                            start: isAllDay ? event.start.date : event.start.dateTime,
                            end: isAllDay ? event.end.date : event.end.dateTime,
                            allDay: isAllDay,
                            backgroundColor: colorStyle.bg,
                            textColor: colorStyle.text
                        };
                    });

                    const calendarEl = document.getElementById('calendar');
                    const calendar = new FullCalendar.Calendar(calendarEl, {
                        initialView: 'dayGrid',
                        initialDate: now, 
                        duration: { weeks: 5 }, 
                        headerToolbar: false, 
                        events: events,
                        locale: 'en',
                        height: 'auto',
                        eventDisplay: 'block',
                        dayMaxEventRows: false 
                    });
                    
                    calendar.render();
                })
                .catch(err => console.error(err));
        });
    </script>
</body>
</html>
