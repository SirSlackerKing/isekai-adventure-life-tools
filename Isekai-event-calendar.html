<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Event Calendar v9.8 (XL Bold)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        /* --- 🎨 ธีมสีสว่างละมุนตา สบายตา ไม่แยงตา --- */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9; 
            margin: 0;
            padding: 10px;
        }

        .calendar-container {
            max-width: 1500px; /* 🚀 ขยายความกว้างรวมของปฏิทินให้กว้างขวางเต็มพิกัด */
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .calendar-header h1 {
            font-size: 38px; /* 🚀 ขยายหัวข้อปฏิทินให้ใหญ่ขึ้น */
            font-weight: 900;
            color: #1e293b;
            margin: 0 0 25px 0;
            letter-spacing: -0.5px;
        }

        /* --- FullCalendar Layout & BIG Size Upgrades --- */
        .fc {
            --fc-border-color: #cbd5e1; /* ปรับเส้นตารางให้เข้มขึ้นเล็กน้อยเพื่อให้เห็นขอบวันชัดๆ */
            --fc-page-bg-color: #ffffff;
        }

        /* 🚀 ขยายความสูงของช่องแต่ละวันให้กว้างขึ้นมาก เพื่อรองรับแท่งกิจกรรมตัวใหญ่ๆ ไม่ให้เบียดล้น */
        .fc-daygrid-day-frame {
            min-height: 180px !important; 
        }

        /* แถบหัววัน Sun - Sat ด้านบน */
        .fc-col-header-cell {
            background-color: #f8fafc !important;
            padding: 18px 0 !important; /* เพิ่มพื้นที่แนวตั้งให้หัววัน */
        }
        .fc-col-header-cell-cushion {
            font-weight: 900 !important;
            color: #334155 !important;
            font-size: 22px !important; /* 🚀 ขยายตัวอักษรวัน Sun - Sat ให้ใหญ่ตะโกน */
            text-decoration: none !important;
        }

        /* ตัวเลขวันที่ภายในช่องตาราง */
        .fc-daygrid-day-number {
            font-weight: 900 !important;
            color: #475569;
            padding: 12px !important;
            font-size: 22px !important; /* 🚀 ขยายตัวเลขวันที่ให้เห็นเด่นชัด */
        }

        /* 🌟 ถมสีช่อง "วันนี้" โทนฟ้าพาสเทล ให้ดูหนาเด่นและชัดเจนที่สุด */
        .fc-day-today {
            background-color: #e0f2fe !important; 
            border: 4px solid #0284c7 !important; /* เพิ่มความหนาเส้นขอบเป็น 4px */
            z-index: 4;
        }

        .fc-day-today .fc-daygrid-day-number {
            color: #0369a1 !important; 
            font-size: 24px !important; /* เลขวันของวันนี้จะใหญ่เป็นพิเศษ */
        }

        /* 🚀 ปรับแต่งแท่งกิจกรรมให้หนา ใหญ่ และเด่นชัด (XL Bold Event Blocks) */
        .fc-daygrid-event-harness {
            margin: 6px 8px !important; /* เพิ่มระยะห่างระหว่างแถวอีเวนต์ให้ดูง่าย ไม่ติดกันเป็นพืด */
        }

        .fc-v-event, .fc-h-event {
            border: none !important;
            border-radius: 10px !important; /* ขอบมนสวยงามสไตล์ Modern UI */
            padding: 10px 14px !important; /* 🚀 เพิ่มพื้นที่ด้านในแท่งสีให้หนาอวบอิ่ม ตัวหนังสือไม่เบียดขอบ */
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.05);
        }

        /* 🚀 ฟอนต์ชื่อกิจกรรมเวอร์ชันขยายใหญ่พิเศษ คมชัดเต็มตา */
        .fc-event-title {
            font-weight: 800 !important;
            font-size: 19px !important; /* 🚀 ขยายตัวหนังสือชื่อกิจกรรมและ Emoji ขึ้นมาเป็น 19px อ่านง่ายมาก */
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <h1>📅 Isekai Event Calendar v9.8</h1>
        </div>
        <div id="calendar"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const CALENDAR_ID = '90139e27a31a630fd671e92c693bea33fea7d8e23950687a3f8f7105328ae5a5@group.calendar.google.com';
            const API_KEY = 'AIzaSyCWQS8RCOqWtRL6qL4nyxRmOu6YvrxK00Q'; 

            const now = new Date();
            now.setHours(0, 0, 0, 0);

            const future = new Date(now);
            future.setDate(now.getDate() + 35); 

            const timeMin = now.toISOString();
            const timeMax = future.toISOString();

            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime&_nocache=${new Date().getTime()}`;

            // โลจิกคู่สีพาสเทล ถอดสเกลตามหน้าจอจริง สบายสายตา
            const customColorLogic = (title) => {
                if (title.includes('[Ranking]')) return { bg: '#81c784', text: '#1b5e20' };      
                if (title.includes('[Special Event]')) return { bg: '#ba68c8', text: '#4a148c' }; 
                if (title.includes('[Regular]')) return { bg: '#cfd8dc', text: '#263238' };       
                if (title.includes('[Mega]')) return { bg: '#fdd835', text: '#4e342e' };          
                if (title.includes('[Guild War]')) return { bg: '#e57373', text: '#b71c1c' };     
                return { bg: '#e2e8f0', text: '#334155' }; 
            };

            // ฟังก์ชันดูดเก็บกลุ่ม Emoji ทั้งหมดท้ายชื่อประโยค
            function extractAllSuffixEmojis(text) {
                const emojiRegex = /([\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{24C2}-\u{1F251}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]+)/gu;
                const matches = text.match(emojiRegex);
                return matches ? matches.join('') : '';
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const events = (data.items || []).map(event => {
                        const isAllDay = event.start.date ? true : false;
                        const colorStyle = customColorLogic(event.summary);
                        
                        // 1. ล้างแท็กประเภทด้านหน้าออกเพื่อความสะอาด
                        let cleanTitle = event.summary
                            .replace(/\[Mega\]|\[Regular\]|\[Guild War\]|\[Special Event\]|\[Ranking\]/g, '')
                            .replace(/:\s*/g, '') 
                            .trim();

                        // 2. ตรวจหาและดูดเอาคลัง Emoji ท้ายประโยคทั้งหมดออกมา
                        const allEmojis = extractAllSuffixEmojis(cleanTitle);

                        if (allEmojis) {
                            // ลบ Emoji ออกจากตำแหน่งท้ายประโยคเดิม
                            cleanTitle = cleanTitle.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{24C2}-\u{1F251}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]/gu, '').trim();
                            // ย้ายสล็อตเอาคลัง Emoji ไปตั้งตระหง่านไว้ข้างหน้าสุดตามใจสั่ง
                            cleanTitle = `${allEmojis} ${cleanTitle}`;
                        } else {
                            if (event.summary.includes('[Mega]')) cleanTitle = `🔸 ${cleanTitle}`;
                            else if (event.summary.includes('[Guild War]')) cleanTitle = `⚔️ ${cleanTitle}`;
                        }

                        return {
                            title: cleanTitle,
                            start: isAllDay ? event.start.date : event.start.dateTime,
                            end: isAllDay ? event.end.date : event.end.dateTime,
                            allDay: isAllDay,
                            backgroundColor: colorStyle.bg,
                            textColor: colorStyle.text
                        };
                    });

                    const calendarEl = document.getElementById('calendar');
                    const calendar = new FullCalendar.Calendar(calendarEl, {
                        initialView: 'dayGrid',
                        initialDate: now, 
                        duration: { weeks: 5 }, 
                        headerToolbar: false, 
                        events: events,
                        locale: 'en',
                        height: 'auto',
                        eventDisplay: 'block',
                        dayMaxEventRows: false 
                    });
                    
                    calendar.render();
                })
                .catch(err => console.error(err));
        });
    </script>
</body>
</html>
